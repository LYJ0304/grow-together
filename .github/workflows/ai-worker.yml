name: AI Worker CI
on:
  pull_request:
    paths: ["apps/ai-worker/**", ".github/workflows/ai-worker.yml"]
  push:
    paths: ["apps/ai-worker/**", ".github/workflows/ai-worker.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/ai-worker } }
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
