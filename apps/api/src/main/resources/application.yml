spring:
  application:
    name: growtogether-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/growtogether}
    username: ${POSTGRES_USER:growtogether}
    password: ${POSTGRES_PASSWORD:local_dev_password}
management:
  endpoints.web.exposure.include: health
springdoc:
  enable-default-api-docs: false
  swagger-ui:
    url: /openapi.yaml
    disable-swagger-default-url: true
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8082,http://localhost:19006}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
    refresh-session-seconds: ${JWT_REFRESH_SESSION_SECONDS:1209600}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    bucket: ${STORAGE_BUCKET:}
    region: ${STORAGE_REGION:us-east-1}
    endpoint: ${STORAGE_ENDPOINT:}
    path-style: ${STORAGE_PATH_STYLE:false}
    url-ttl-seconds: ${STORAGE_URL_TTL_SECONDS:300}
    cleanup-enabled: ${STORAGE_CLEANUP_ENABLED:true}
    cleanup-interval-ms: ${STORAGE_CLEANUP_INTERVAL_MS:3600000}
