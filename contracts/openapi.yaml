openapi: 3.1.0
info:
  title: GrowTogether API
  version: 0.1.0
paths:
  /api/v1/children/me:
    post:
      operationId: createChildProfile
      summary: Register the authenticated user's first child profile
      description: >-
        Creates one profile per account. An existing profile returns 409 without
        changing it. Ownership comes exclusively from the access JWT. Validation
        and name normalization are the same as PUT. Optional personalization is stored
        atomically; omission or null uses empty/default personalization for a new profile.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildProfileRequest' }
      responses:
        '201': { $ref: '#/components/responses/ChildProfile' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Account no longer exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: A child profile is already registered for this account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: getChildProfile
      summary: Get the authenticated user's child profile
      description: Each account has at most one child profile. A missing profile returns 404.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ChildProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No child profile registered for this account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: saveChildProfile
      summary: Create or replace the authenticated user's child profile
      description: >-
        Returns 200 for both creation and replacement. Ownership comes exclusively from
        the access JWT. Name is trimmed before validation and storage. Birthday must be
        a real calendar date from year 0001 through today (server date).
        Omitted or null personalization preserves existing values. An explicit object
        replaces all personalization fields; {} clears them. A birthday edit that
        conflicts with a preserved expected due date returns 400 without mutation.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildProfileRequest' }
      responses:
        '200': { $ref: '#/components/responses/ChildProfile' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Account no longer exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/health:
    get:
      summary: Get API health
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: UP }
                  service: { type: string, example: growtogether-api }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/signup:
    post:
      operationId: signup
      summary: Create an email/password account
      description: Email is stored lowercased. Passwords are hashed with BCrypt; UTF-8 input must not exceed 72 bytes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: Signup Successful }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Issue an access JWT and a refresh token
      description: Each login creates an independent session. Incorrect email and password use the same error response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate a refresh token and issue a new access JWT
      description: >-
        Authenticated by the refresh token in the JSON body; no access JWT is required.
        Session lifetime is absolute (14 days by default). Reuse of a previously consumed
        refresh token revokes that session, including its access JWTs. Clients must serialize
        refresh requests and atomically replace stored refresh tokens after success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the session identified by a refresh token
      description: >-
        Access tokens for that session become invalid immediately. Other device sessions
        remain active. Unknown and previously revoked tokens return 204, making logout
        idempotent. A consumed refresh token may also revoke its session. The client must
        clear its local tokens after logout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204':
          description: Session revoked or already absent
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/todos/generate:
    post:
      operationId: generateSchedule
      summary: Generate a preview without saving todos
      description: >-
        Reads only the authenticated user's profile and existing schedules. Uses the current
        worker /internal/v1/schedule/generate contract. No transaction is held during generation.
        Local calendar date and explicit available windows are required. Missing/blank instructions
        use a general request for manageable shared activities. Unknown existing durations return
        409; edit those todos first. Out-of-range child ages are omitted, never clamped.
        Generated candidates plus unscheduled activities respect the stored daily activity budget.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleGenerateRequest' }
      responses:
        '200':
          description: Preview only; unscheduled activities cannot be confirmed for storage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePreview' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
        '502': { $ref: '#/components/responses/ScheduleUpstreamError' }
        '503': { $ref: '#/components/responses/ScheduleUnavailable' }
        '504': { $ref: '#/components/responses/ScheduleTimeout' }
  /api/v1/todos/batch:
    post:
      operationId: confirmSchedule
      summary: Atomically append confirmed schedule candidates
      description: >-
        Locks the owner row shared with Todo create/update/delete, rechecks current schedules
        and the current profile activity budget, and appends all candidates in one transaction.
        Never overwrites existing todos. Unknown existing duration, overlapping candidates,
        midnight overflow or changed budget return 409 with no writes. No automatic retries or
        exactly-once guarantee: after an uncertain response, inspect GET todos for this date.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleBatchRequest' }
      responses:
        '201':
          description: All saved todos in time order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TodoResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Account no longer exists
        '409': { $ref: '#/components/responses/ScheduleConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/todos:
    post:
      operationId: createTodo
      summary: Create a todo for the authenticated user
      description: The owner is taken from the access JWT, never from the request body.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoRequest' }
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: Todo created Successful }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Account no longer exists
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: getTodos
      summary: List the authenticated user's todos for a date in scheduled time order
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Matching todos, or an empty array
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TodoResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getTodo
      summary: Get a todo owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Todo' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateTodo
      summary: Replace schedule fields of an owned todo, preserving completion
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoRequest' }
      responses:
        '200': { $ref: '#/components/responses/Todo' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteTodo
      summary: Delete a todo owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Todo deleted }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/todos/{id}/completion:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: setTodoCompletion
      summary: Set completion of a todo owned by the authenticated user
      description: Idempotently sets the explicit completion state. New and existing migrated todos default to false.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Todo' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/diary:
    post:
      operationId: createDiary
      summary: Create a diary for the authenticated user
      description: >-
        Requires an explicit local diaryDate and allows one diary per user/date.
        Links existing todos owned by the authenticated user and stores image URLs.
        Duplicate todo IDs are linked once. Todos owned by another user or without
        a known owner are treated as missing, even if not linked to a diary.
        Todos linked to another diary of this user must be detached first.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '409':
          description: A diary already exists for this user/date, or a todo is linked elsewhere
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: getDiaryMonth
      summary: List dated diary IDs for the authenticated user and month
      description: Date-ascending minimal list. Undated legacy records are excluded. Empty months return an empty array.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-11' }
      responses:
        '200':
          description: Diary dates and IDs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DiarySummary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/diary/by-date:
    get:
      operationId: getDiaryByDate
      summary: Get a diary by the authenticated user's local diary date
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/diary/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getDiary
      summary: Get a diary owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateDiary
      summary: Replace diary content, todo links, and image URLs, preserving diaryDate
      description: >-
        Only the owner can update a diary. Both lists are required; an empty list
        clears the corresponding links or images. Removed todos are preserved.
        The entire request is atomic. A todo linked to another diary of this
        user returns 409; a todo owned by another user or without a known owner
        returns 404, even if not linked to a diary.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryRequest' }
      responses:
        '200': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '409': { $ref: '#/components/responses/TodoAlreadyLinked' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteDiary
      summary: Delete an owned diary and its image records, preserving todos
      description: Todo links are cleared. No external image files are deleted.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Diary deleted }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/files/presigned-url:
    post:
      operationId: issueFileUploadUrl
      summary: Register a pending file and issue an S3 upload URL
      description: >-
        Generates an object key on the server. Upload directly to S3 using PUT with
        the declared Content-Type, then call the completion endpoint. Files must
        not exceed the configured app.storage.s3.max-file-size (10 MB by default).
        A presigned PUT URL does not enforce that size limit on S3 itself.
        expiresAt describes the configured signing lifetime; underlying AWS credentials
        may expire earlier. A URL can be reused until it expires, including after completion.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignedUrlRequest' }
      responses:
        '201':
          description: Pending file registered and upload URL issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignedUrlResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/files/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeFileUpload
      summary: Verify an owned S3 object and complete its pending upload
      description: >-
        Verifies that the actual size and Content-Type match the registration and
        that the size is within the configured limit. Failed verification leaves
        the file pending. Missing files and files owned by another user return 404.
        Content-Type is S3 object metadata; file bytes are not inspected.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Upload completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: File not found, not owned by the caller, or not uploaded to S3
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: File is no longer pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        API access JWT. Signature, issuer, expiration, and persisted session status are
        validated on each authenticated request. Authentication endpoints use their JSON
        credentials instead; an Authorization header on those endpoints is ignored.
  schemas:
    ChildProfileRequest:
      type: object
      required: [name, birthday]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
          description: Leading and trailing whitespace is trimmed; the resulting name must contain 1 to 50 characters.
        birthday:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: A real calendar date from 0001-01-01 through today (server date).
          example: '2024-03-15'
        personalization:
          description: Optional. Omission/null preserves existing values on PUT; an explicit object replaces all choices.
          anyOf:
            - { $ref: '#/components/schemas/ChildPersonalizationRequest' }
            - { type: 'null' }
    ChildProfileResponse:
      type: object
      required: [name, birthday, personalization]
      properties:
        personalization: { $ref: '#/components/schemas/ChildPersonalizationResponse' }
        name: { type: string, minLength: 1, maxLength: 50 }
        birthday: { type: string, format: date }
    ChildPersonalizationRequest:
      type: object
      additionalProperties: false
      description: >-
        All fields are optional. Missing/null lists normalize to empty arrays and
        missing scalar fields normalize to null. Only explicitly approved question
        IDs may be stored; no questions are approved in this version, so nonempty
        developmentObservations is rejected. No corrected age or diagnosis is computed.
      properties:
        prematurityStatus:
          type: [string, 'null']
          enum: ['yes', 'no', 'unknown', null]
        expectedDueDate:
          type: [string, 'null']
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: Real date from year 0001 to 9999 strictly after birthday. Requires prematurityStatus yes. May be future and is not required for yes.
        concerns:
          type: [array, 'null']
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/ChildConcern' }
          description: none is exclusive; [] means skipped and differs from [none].
        availableActivityTime:
          type: [string, 'null']
          enum: ['5min', '10min', '15to20min', 'flexible', null]
        developmentObservations:
          type: [array, 'null']
          maxItems: 0
          items: { $ref: '#/components/schemas/DevelopmentObservation' }
          description: Must be empty or null until a source-reviewed catalog is available. Future capacity is at most five, not enabled now.
      allOf:
        - if:
            required: [expectedDueDate]
            properties:
              expectedDueDate: { type: string }
          then:
            required: [prematurityStatus]
            properties:
              prematurityStatus: { const: 'yes' }
        - if:
            required: [concerns]
            properties:
              concerns:
                type: array
                contains: { const: none }
          then:
            properties:
              concerns: { maxItems: 1 }
    ChildPersonalizationResponse:
      type: object
      required: [prematurityStatus, expectedDueDate, concerns, availableActivityTime, developmentObservations]
      properties:
        prematurityStatus:
          type: [string, 'null']
          enum: ['yes', 'no', 'unknown', null]
        expectedDueDate: { type: [string, 'null'], format: date }
        concerns:
          type: array
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/ChildConcern' }
        availableActivityTime:
          type: [string, 'null']
          enum: ['5min', '10min', '15to20min', 'flexible', null]
        developmentObservations:
          type: array
          maxItems: 0
          items: { $ref: '#/components/schemas/DevelopmentObservation' }
    ChildConcern:
      type: string
      enum: [sleep, feeding, emotion_expression, communication, developmental_play, daily_habits, separation_anxiety, none]
    DevelopmentObservation:
      type: object
      required: [questionId, answer]
      description: Reserved answer shape. No question IDs are approved in the current version; nonempty answer arrays are rejected.
      properties:
        questionId: { type: string, minLength: 1, maxLength: 100, pattern: '\S' }
        answer: { type: string, enum: ['yes', not_yet, unknown] }
    PresignedUrlRequest:
      type: object
      required: [filename, contentType, fileSize]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        contentType: { type: string, minLength: 1, maxLength: 100, pattern: '\S' }
        fileSize: { type: integer, format: int64, minimum: 1 }
    PresignedUrlResponse:
      type: object
      required: [fileId, uploadUrl, objectKey, expiresAt]
      properties:
        fileId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        objectKey: { type: string }
        expiresAt: { type: string, format: date-time }
    FileResponse:
      type: object
      required: [id, filename, contentType, fileSize, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        fileSize: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        createdAt: { type: string, format: date-time }
    DiaryCreateRequest:
      allOf:
        - { $ref: '#/components/schemas/DiaryRequest' }
        - type: object
          required: [diaryDate]
          properties:
            diaryDate: { type: string, format: date, description: Explicit user-selected local date, not inferred from todos or server time }
    DiarySummary:
      type: object
      required: [id, diaryDate]
      properties:
        id: { type: integer, format: int64 }
        diaryDate: { type: string, format: date }
    DiaryRequest:
      type: object
      required: [todoIds, diaryFiles]
      properties:
        content: { type: [string, 'null'], maxLength: 1000 }
        todoIds:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
        diaryFiles:
          type: array
          items: { $ref: '#/components/schemas/DiaryFileRequest' }
    DiaryFileRequest:
      type: object
      required: [imageUrl]
      properties:
        imageUrl: { type: string, minLength: 1, maxLength: 2048, pattern: '\S' }
    DiaryResponse:
      type: object
      required: [id, diaryDate, todos, diaryFiles]
      properties:
        id: { type: integer, format: int64 }
        diaryDate: { type: [string, 'null'], format: date, description: Null for preserved undated legacy records }
        content: { type: [string, 'null'], maxLength: 1000 }
        todos:
          type: array
          items: { $ref: '#/components/schemas/TodoResponse' }
        diaryFiles:
          type: array
          items:
            type: object
            required: [id, imageUrl]
            properties:
              id: { type: integer, format: int64 }
              imageUrl: { type: string, maxLength: 2048 }
    ScheduleWindow:
      type: object
      required: [start, end]
      properties:
        start: { type: string, example: '09:00:00', description: Local start strictly before end }
        end: { type: string, example: '18:00:00', description: Same-day local time without UTC offset }
    ScheduleGenerateRequest:
      type: object
      required: [date, availableWindows]
      properties:
        date: { type: string, format: date }
        instructions: { type: [string, 'null'], maxLength: 1000 }
        availableWindows:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ScheduleWindow' }
        maxCandidates: { type: [integer, 'null'], minimum: 1, maximum: 10, default: 5 }
    ScheduleCandidate:
      type: object
      required: [planName, scheduledTime, durationMinutes]
      properties:
        planName: { type: string, minLength: 1, maxLength: 80, pattern: '\S' }
        content: { type: [string, 'null'], maxLength: 255 }
        scheduledTime: { type: string, example: '09:00:00', description: Same-day local time without UTC offset }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
    ScheduleUnscheduled:
      type: object
      required: [planName, durationMinutes]
      properties:
        planName: { type: string, minLength: 1, maxLength: 80 }
        content: { type: [string, 'null'], maxLength: 255 }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
    SchedulePreview:
      type: object
      required: [date, candidates, unscheduled]
      properties:
        date: { type: string, format: date }
        candidates:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ScheduleCandidate' }
        unscheduled:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ScheduleUnscheduled' }
    ScheduleBatchRequest:
      type: object
      required: [date, candidates]
      properties:
        date: { type: string, format: date }
        candidates:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ScheduleCandidate' }
    TodoRequest:
      type: object
      required: [planName, scheduledDate, scheduledTime]
      properties:
        durationMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440, description: Optional for legacy compatibility. Must end within the same day. Omission/null on PUT preserves the stored value. Unknown durations must be supplied before AI generation for that date. }
        planName: { type: string, minLength: 1, maxLength: 80, pattern: '\S' }
        content: { type: [string, 'null'], maxLength: 255 }
        scheduledDate: { type: string, format: date }
        scheduledTime: { type: string, example: '09:00:00', description: Local time without a time zone }
    TodoResponse:
      type: object
      required: [id, planName, scheduledDate, scheduledTime, completed]
      properties:
        durationMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440, description: Optional for legacy compatibility. Must end within the same day. Omission/null on PUT preserves the stored value. Unknown durations must be supplied before AI generation for that date. }
        completed: { type: boolean }
        id: { type: integer, format: int64 }
        planName: { type: string, maxLength: 80 }
        content: { type: [string, 'null'], maxLength: 255 }
        scheduledDate: { type: string, format: date }
        scheduledTime: { type: string, example: '09:00:00', description: Local time without a time zone }
    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, pattern: '\S' }
        email: { type: string, format: email, minLength: 1, maxLength: 254, pattern: '\S' }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          pattern: '\S'
          description: Must contain a non-whitespace character; also limited to 72 UTF-8 bytes. Whitespace is not trimmed.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 1, maxLength: 254, pattern: '\S' }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          pattern: '\S'
          description: Must contain a non-whitespace character; also limited to 72 UTF-8 bytes. Whitespace is not trimmed.
    TokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 200, pattern: '\S', writeOnly: true }
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string, description: Signed access JWT }
        refreshToken: { type: string, description: Opaque random token; only its SHA-256 digest is stored }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64, minimum: 1, description: Access-token lifetime in seconds }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, BAD_REQUEST, EMAIL_ALREADY_EXISTS, INVALID_CREDENTIALS, INVALID_REFRESH_TOKEN, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL_ERROR]
        message: { type: string }
  responses:
    ScheduleConflict:
      description: Existing duration is unknown, or schedule/profile conditions conflict; inspect and regenerate
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ScheduleUpstreamError:
      description: Invalid worker response or upstream failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ScheduleUnavailable:
      description: Worker is unconfigured or cannot be reached
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ScheduleTimeout:
      description: Worker/model timeout
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ChildProfile:
      description: Child profile for the authenticated account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ChildProfileResponse' }
    Diary:
      description: Diary details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DiaryResponse' }
    DiaryOrTodoNotFound:
      description: Diary or todo does not exist, belongs to another user, or has no known owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TodoAlreadyLinked:
      description: Todo is already linked to another diary of the authenticated user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Todo:
      description: Todo details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TodoResponse' }
    TodoNotFound:
      description: Todo does not exist, belongs to another user, or has no known owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Tokens:
      description: Tokens issued; response must not be cached
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Pragma: { schema: { type: string, const: no-cache } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LoginResponse' }
    InvalidRequest:
      description: Invalid request fields or malformed JSON
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Invalid credentials, expired/revoked token, or refresh-token reuse
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Unsupported request content type
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
