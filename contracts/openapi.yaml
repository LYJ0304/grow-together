openapi: 3.1.0
info:
  title: GrowTogether API
  version: 0.1.0
paths:
  /api/health:
    get:
      summary: Get API health
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: UP }
                  service: { type: string, example: growtogether-api }
  /api/v1/auth/signup:
    post:
      operationId: signup
      summary: Create an email/password account
      description: Email is stored lowercased. Passwords are hashed with BCrypt; UTF-8 input must not exceed 72 bytes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: Signup Successful }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Issue an access JWT and a refresh token
      description: Each login creates an independent session. Incorrect email and password use the same error response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate a refresh token and issue a new access JWT
      description: >-
        Authenticated by the refresh token in the JSON body; no access JWT is required.
        Session lifetime is absolute (14 days by default). Reuse of a previously consumed
        refresh token revokes that session, including its access JWTs. Clients must serialize
        refresh requests and atomically replace stored refresh tokens after success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the session identified by a refresh token
      description: >-
        Access tokens for that session become invalid immediately. Other device sessions
        remain active. Unknown and previously revoked tokens return 204, making logout
        idempotent. A consumed refresh token may also revoke its session. The client must
        clear its local tokens after logout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: Session revoked or already absent }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/todos:
    post:
      operationId: createTodo
      summary: Create a todo for the authenticated user
      description: The owner is taken from the access JWT, never from the request body.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoRequest' }
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: Todo created Successful }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415':
          description: Unsupported request content type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: getTodos
      summary: List the authenticated user's todos for a date in scheduled time order
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Matching todos, or an empty array
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TodoResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getTodo
      summary: Get a todo owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Todo' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
    put:
      operationId: updateTodo
      summary: Replace all editable fields of a todo owned by the authenticated user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoRequest' }
      responses:
        '200': { $ref: '#/components/responses/Todo' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
    delete:
      operationId: deleteTodo
      summary: Delete a todo owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Todo deleted }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
  /api/v1/diary:
    post:
      operationId: createDiary
      summary: Create a diary for the authenticated user
      description: >-
        Links existing todos owned by the authenticated user and stores image URLs.
        Duplicate todo IDs are linked once. Todos owned by another user or without
        a known owner are treated as missing, even if not linked to a diary.
        Todos linked to another diary of this user must be detached first.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryRequest' }
      responses:
        '201': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '409': { $ref: '#/components/responses/TodoAlreadyLinked' }
  /api/v1/diary/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getDiary
      summary: Get a diary owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
    put:
      operationId: updateDiary
      summary: Replace diary content, todo links, and image URLs
      description: >-
        Only the owner can update a diary. Both lists are required; an empty list
        clears the corresponding links or images. Removed todos are preserved.
        The entire request is atomic. A todo linked to another diary of this
        user returns 409; a todo owned by another user or without a known owner
        returns 404, even if not linked to a diary.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryRequest' }
      responses:
        '200': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '409': { $ref: '#/components/responses/TodoAlreadyLinked' }
    delete:
      operationId: deleteDiary
      summary: Delete an owned diary and its image records, preserving todos
      description: Todo links are cleared. No external image files are deleted.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Diary deleted }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
  /api/v1/chat-threads:
    post:
      operationId: createChatThread
      summary: Create an owned counseling thread
      description: Only ownership is persisted. Messages remain in the authenticated client session.
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Thread created
          content:
            application/json:
              schema:
                type: object
                required: [threadId]
                properties:
                  threadId: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/chat-threads/{threadId}/runs:
    post:
      operationId: runCounselor
      summary: Stream an AG-UI counseling run
      description: >-
        AG-UI 1.0 text-only RunAgentInput. The thread must belong to the authenticated
        user and match threadId in the body. The final message must be a user message.
        Clients supply a new runId on every attempt; retrying does not resume a stream.
        HTTP 200 alone is not success: RUN_ERROR is failure, and a response closing
        without RUN_FINISHED or RUN_ERROR is truncated. Disconnect cancels upstream
        work once detected (heartbeat every 5 seconds). A run is limited to 125 seconds.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: threadId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRunInput' }
      responses:
        '200':
          description: >-
            SSE frames use data containing one JSON AG-UI event. Comments are keep-alives.
            Event order is RUN_STARTED, TEXT_MESSAGE_START, TEXT_MESSAGE_CONTENT (repeated),
            TEXT_MESSAGE_END, RUN_FINISHED; failures terminate with RUN_ERROR instead.
            Worker connection/configuration failures after headers also use RUN_ERROR.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            X-Accel-Buffering: { schema: { type: string, const: 'no' } }
          content:
            text/event-stream:
              schema:
                type: string
                description: AG-UI 1.0 JSON events encoded as SSE; not one JSON document.
              example: "data: {\"type\":\"RUN_STARTED\",\"threadId\":\"thread-1\",\"runId\":\"run-1\",\"protocolVersion\":\"1.0\"}\n\n"
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Thread does not exist or belongs to another user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Worker authentication is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        API access JWT. Signature, issuer, expiration, and persisted session status are
        validated on each authenticated request. Authentication endpoints use their JSON
        credentials instead; an Authorization header on those endpoints is ignored.
  schemas:
    AgentRunInput:
      type: object
      required: [threadId, runId, messages]
      properties:
        threadId: { type: string, format: uuid, maxLength: 64 }
        runId: { type: string, minLength: 1, maxLength: 64, pattern: '\S' }
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: object
            required: [id, role, content]
            properties:
              id: { type: string, minLength: 1, maxLength: 64, pattern: '\S' }
              role: { type: string, enum: [user, assistant] }
              content: { type: string, minLength: 1, maxLength: 4000, pattern: '\S' }
        state: { type: object, maxProperties: 0 }
        tools: { type: array, maxItems: 0, items: {} }
        context: { type: array, maxItems: 0, items: {} }
        resume: { type: array, maxItems: 0, items: {} }
        forwardedProps: { type: [object, 'null'], maxProperties: 0 }
        protocolVersion: { type: string, description: Optional client version declaration }
    DiaryRequest:
      type: object
      required: [todoIds, diaryFiles]
      properties:
        content: { type: [string, 'null'], maxLength: 1000 }
        todoIds:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
        diaryFiles:
          type: array
          items: { $ref: '#/components/schemas/DiaryFileRequest' }
    DiaryFileRequest:
      type: object
      required: [imageUrl]
      properties:
        imageUrl: { type: string, minLength: 1, maxLength: 2048, pattern: '\S' }
    DiaryResponse:
      type: object
      required: [id, todos, diaryFiles]
      properties:
        id: { type: integer, format: int64 }
        content: { type: [string, 'null'], maxLength: 1000 }
        todos:
          type: array
          items: { $ref: '#/components/schemas/TodoResponse' }
        diaryFiles:
          type: array
          items:
            type: object
            required: [id, imageUrl]
            properties:
              id: { type: integer, format: int64 }
              imageUrl: { type: string, maxLength: 2048 }
    TodoRequest:
      type: object
      required: [planName, scheduledDate, scheduledTime]
      properties:
        planName: { type: string, minLength: 1, maxLength: 80, pattern: '\S' }
        content: { type: [string, 'null'] }
        scheduledDate: { type: string, format: date }
        scheduledTime: { type: string, example: '09:00:00', description: Local time without a time zone }
    TodoResponse:
      type: object
      required: [id, planName, scheduledDate, scheduledTime]
      properties:
        id: { type: integer, format: int64 }
        planName: { type: string }
        content: { type: [string, 'null'] }
        scheduledDate: { type: string, format: date }
        scheduledTime: { type: string, example: '09:00:00', description: Local time without a time zone }
    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, pattern: '\S' }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          description: Also limited to 72 UTF-8 bytes; whitespace is not trimmed.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          description: Also limited to 72 UTF-8 bytes; whitespace is not trimmed.
    TokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 200, pattern: '\S', writeOnly: true }
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string, description: Signed access JWT }
        refreshToken: { type: string, description: Opaque random token; only its SHA-256 digest is stored }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64, minimum: 1, description: Access-token lifetime in seconds }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, EMAIL_ALREADY_EXISTS, INVALID_CREDENTIALS, INVALID_REFRESH_TOKEN, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL_ERROR, SERVICE_UNAVAILABLE]
        message: { type: string }
  responses:
    Diary:
      description: Diary details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DiaryResponse' }
    DiaryOrTodoNotFound:
      description: Diary or todo does not exist, belongs to another user, or has no known owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TodoAlreadyLinked:
      description: Todo is already linked to another diary of the authenticated user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Todo:
      description: Todo details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TodoResponse' }
    TodoNotFound:
      description: Todo does not exist, belongs to another user, or has no known owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Tokens:
      description: Tokens issued; response must not be cached
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Pragma: { schema: { type: string, const: no-cache } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LoginResponse' }
    InvalidRequest:
      description: Invalid request fields or malformed JSON
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Invalid credentials, expired/revoked token, or refresh-token reuse
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
