openapi: 3.1.0
info:
  title: GrowTogether API
  version: 0.1.0
paths:
  /api/health:
    get:
      summary: Get API health
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: UP }
                  service: { type: string, example: growtogether-api }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/signup:
    post:
      operationId: signup
      summary: Create an email/password account
      description: Email is stored lowercased. Passwords are hashed with BCrypt; UTF-8 input must not exceed 72 bytes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: Signup Successful }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Issue an access JWT and a refresh token
      description: Each login creates an independent session. Incorrect email and password use the same error response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate a refresh token and issue a new access JWT
      description: >-
        Authenticated by the refresh token in the JSON body; no access JWT is required.
        Session lifetime is absolute (14 days by default). Reuse of a previously consumed
        refresh token revokes that session, including its access JWTs. Clients must serialize
        refresh requests and atomically replace stored refresh tokens after success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the session identified by a refresh token
      description: >-
        Access tokens for that session become invalid immediately. Other device sessions
        remain active. Unknown and previously revoked tokens return 204, making logout
        idempotent. A consumed refresh token may also revoke its session. The client must
        clear its local tokens after logout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204':
          description: Session revoked or already absent
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/todos:
    post:
      operationId: createTodo
      summary: Create a todo for the authenticated user
      description: The owner is taken from the access JWT, never from the request body.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoRequest' }
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: Todo created Successful }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: getTodos
      summary: List the authenticated user's todos for a date in scheduled time order
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Matching todos, or an empty array
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TodoResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getTodo
      summary: Get a todo owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Todo' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateTodo
      summary: Replace all editable fields of a todo owned by the authenticated user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoRequest' }
      responses:
        '200': { $ref: '#/components/responses/Todo' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteTodo
      summary: Delete a todo owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Todo deleted }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/diary:
    post:
      operationId: createDiary
      summary: Create a diary for the authenticated user
      description: >-
        Links existing todos owned by the authenticated user and stores image URLs.
        Duplicate todo IDs are linked once. Todos owned by another user or without
        a known owner are treated as missing, even if not linked to a diary.
        Todos linked to another diary of this user must be detached first.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryRequest' }
      responses:
        '201': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '409': { $ref: '#/components/responses/TodoAlreadyLinked' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/diary/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getDiary
      summary: Get a diary owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateDiary
      summary: Replace diary content, todo links, and image URLs
      description: >-
        Only the owner can update a diary. Both lists are required; an empty list
        clears the corresponding links or images. Removed todos are preserved.
        The entire request is atomic. A todo linked to another diary of this
        user returns 409; a todo owned by another user or without a known owner
        returns 404, even if not linked to a diary.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryRequest' }
      responses:
        '200': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '409': { $ref: '#/components/responses/TodoAlreadyLinked' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteDiary
      summary: Delete an owned diary and its image records, preserving todos
      description: Todo links are cleared. No external image files are deleted.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Diary deleted }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/files/presigned-url:
    post:
      operationId: initiateFileUpload
      summary: Create a private file upload
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          description: Storage disabled or provider temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      description: Upload JPEG/PNG/WebP up to 5MiB. PUT the raw body to uploadUrl using
        every returned header. Do not send the API bearer token to storage. Original
        filename extension must match contentType; path separators and control characters
        are forbidden. A new server-generated key is used for each request.
  /api/v1/files/{id}/complete:
    post:
      operationId: completeFileUpload
      summary: Verify object metadata and mark READY
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          description: File absent or belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Storage disabled or provider temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Object missing, metadata mismatch, expired upload or invalid
            file state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Owner only. HEAD size and Content-Type must match. READY completion
        is idempotent. Missing object stays PENDING; mismatch becomes FAILED. PENDING
        expires after 24 hours. This does not inspect file bytes.
  /api/v1/files/{id}:
    get:
      operationId: getFileMetadata
      summary: Read owned file metadata
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadataResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          description: File absent or belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteFile
      summary: Delete owned file
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          description: File absent or belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Storage disabled or provider temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Marks DELETING before attempting storage deletion; failures retain
        state for retry. A tombstone is retained until the issued upload URL expires,
        then cleanup retries deletion. Download URLs already issued remain usable until
        expiry or object deletion.
  /api/v1/files/{id}/download-url:
    get:
      operationId: getFileDownloadUrl
      summary: Create a short-lived download URL for an owned READY file
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrlResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          description: File absent or belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Storage disabled or provider temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Object missing, metadata mismatch, expired upload or invalid
            file state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        API access JWT. Signature, issuer, expiration, and persisted session status are
        validated on each authenticated request. Authentication endpoints use their JSON
        credentials instead; an Authorization header on those endpoints is ignored.
  schemas:
    UploadUrlRequest:
      type: object
      required:
      - originalName
      - contentType
      - size
      properties:
        originalName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
    UploadUrlResponse:
      type: object
      required:
      - id
      - uploadUrl
      - expiresAt
      - headers
      properties:
        id:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
          description: 'All headers required by the signed PUT, including Content-Type,
            Content-Length and If-None-Match: *.'
    DownloadUrlResponse:
      type: object
      required:
      - downloadUrl
      - expiresAt
      properties:
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    FileMetadataResponse:
      type: object
      required:
      - id
      - originalName
      - contentType
      - size
      - status
      - createdAt
      - uploadedAt
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - PENDING
          - READY
          - FAILED
          - DELETING
        createdAt:
          type: string
          format: date-time
        uploadedAt:
          type:
          - string
          - 'null'
          format: date-time
    DiaryRequest:
      type: object
      required: [todoIds, diaryFiles]
      properties:
        content: { type: [string, 'null'], maxLength: 1000 }
        todoIds:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
        diaryFiles:
          type: array
          items: { $ref: '#/components/schemas/DiaryFileRequest' }
    DiaryFileRequest:
      type: object
      required: [imageUrl]
      properties:
        imageUrl: { type: string, minLength: 1, maxLength: 2048, pattern: '\S' }
    DiaryResponse:
      type: object
      required: [id, todos, diaryFiles]
      properties:
        id: { type: integer, format: int64 }
        content: { type: [string, 'null'], maxLength: 1000 }
        todos:
          type: array
          items: { $ref: '#/components/schemas/TodoResponse' }
        diaryFiles:
          type: array
          items:
            type: object
            required: [id, imageUrl]
            properties:
              id: { type: integer, format: int64 }
              imageUrl: { type: string, maxLength: 2048 }
    TodoRequest:
      type: object
      required: [planName, scheduledDate, scheduledTime]
      properties:
        planName: { type: string, minLength: 1, maxLength: 80, pattern: '\S' }
        content: { type: [string, 'null'], maxLength: 255 }
        scheduledDate: { type: string, format: date }
        scheduledTime: { type: string, example: '09:00:00', description: Local time without a time zone }
    TodoResponse:
      type: object
      required: [id, planName, scheduledDate, scheduledTime]
      properties:
        id: { type: integer, format: int64 }
        planName: { type: string, maxLength: 80 }
        content: { type: [string, 'null'], maxLength: 255 }
        scheduledDate: { type: string, format: date }
        scheduledTime: { type: string, example: '09:00:00', description: Local time without a time zone }
    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, pattern: '\S' }
        email: { type: string, format: email, minLength: 1, maxLength: 254, pattern: '\S' }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          pattern: '\S'
          description: Must contain a non-whitespace character; also limited to 72 UTF-8 bytes. Whitespace is not trimmed.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 1, maxLength: 254, pattern: '\S' }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          pattern: '\S'
          description: Must contain a non-whitespace character; also limited to 72 UTF-8 bytes. Whitespace is not trimmed.
    TokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 200, pattern: '\S', writeOnly: true }
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string, description: Signed access JWT }
        refreshToken: { type: string, description: Opaque random token; only its SHA-256 digest is stored }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64, minimum: 1, description: Access-token lifetime in seconds }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, EMAIL_ALREADY_EXISTS, INVALID_CREDENTIALS, INVALID_REFRESH_TOKEN, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL_ERROR]
        message: { type: string }
  responses:
    Diary:
      description: Diary details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DiaryResponse' }
    DiaryOrTodoNotFound:
      description: Diary or todo does not exist, belongs to another user, or has no known owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TodoAlreadyLinked:
      description: Todo is already linked to another diary of the authenticated user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Todo:
      description: Todo details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TodoResponse' }
    TodoNotFound:
      description: Todo does not exist, belongs to another user, or has no known owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Tokens:
      description: Tokens issued; response must not be cached
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Pragma: { schema: { type: string, const: no-cache } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LoginResponse' }
    InvalidRequest:
      description: Invalid request fields or malformed JSON
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Invalid credentials, expired/revoked token, or refresh-token reuse
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Unsupported request content type
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
