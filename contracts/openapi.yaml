openapi: 3.1.0
info:
  title: GrowTogether API
  version: 0.1.0
paths:
  /api/health:
    get:
      summary: Get API health
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: UP }
                  service: { type: string, example: growtogether-api }
  /api/v1/auth/signup:
    post:
      operationId: signup
      summary: Create an email/password account
      description: Email is stored lowercased. Passwords are hashed with BCrypt; UTF-8 input must not exceed 72 bytes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: Signup Successful }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Issue an access JWT and a refresh token
      description: Each login creates an independent session. Incorrect email and password use the same error response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate a refresh token and issue a new access JWT
      description: >-
        Authenticated by the refresh token in the JSON body; no access JWT is required.
        Session lifetime is absolute (14 days by default). Reuse of a previously consumed
        refresh token revokes that session, including its access JWTs. Clients must serialize
        refresh requests and atomically replace stored refresh tokens after success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the session identified by a refresh token
      description: >-
        Access tokens for that session become invalid immediately. Other device sessions
        remain active. Unknown and previously revoked tokens return 204, making logout
        idempotent. A consumed refresh token may also revoke its session. The client must
        clear its local tokens after logout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: Session revoked or already absent }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/todos:
    post:
      operationId: createTodo
      summary: Create a todo for the authenticated user
      description: The owner is taken from the access JWT, never from the request body.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoRequest' }
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: Todo created Successful }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415':
          description: Unsupported request content type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: getTodos
      summary: List the authenticated user's todos for a date in scheduled time order
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Matching todos, or an empty array
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TodoResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getTodo
      summary: Get a todo owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Todo' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
    put:
      operationId: updateTodo
      summary: Replace all editable fields of a todo owned by the authenticated user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoRequest' }
      responses:
        '200': { $ref: '#/components/responses/Todo' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
    delete:
      operationId: deleteTodo
      summary: Delete a todo owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Todo deleted }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TodoNotFound' }
  /api/v1/diary:
    post:
      operationId: createDiary
      summary: Create a diary for the authenticated user
      description: >-
        Links existing todos owned by the authenticated user and stores image URLs.
        Duplicate todo IDs are linked once. Todos owned by another user or without
        a known owner are treated as missing, even if not linked to a diary.
        Todos linked to another diary of this user must be detached first.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryRequest' }
      responses:
        '201': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '409': { $ref: '#/components/responses/TodoAlreadyLinked' }
  /api/v1/diary/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getDiary
      summary: Get a diary owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
    put:
      operationId: updateDiary
      summary: Replace diary content, todo links, and image URLs
      description: >-
        Only the owner can update a diary. Both lists are required; an empty list
        clears the corresponding links or images. Removed todos are preserved.
        The entire request is atomic. A todo linked to another diary of this
        user returns 409; a todo owned by another user or without a known owner
        returns 404, even if not linked to a diary.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryRequest' }
      responses:
        '200': { $ref: '#/components/responses/Diary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
        '409': { $ref: '#/components/responses/TodoAlreadyLinked' }
    delete:
      operationId: deleteDiary
      summary: Delete an owned diary and its image records, preserving todos
      description: Todo links are cleared. No external image files are deleted.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Diary deleted }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DiaryOrTodoNotFound' }
  /api/v1/chats:
    post:
      operationId: createChat
      summary: Create a conversation for the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listChats
      summary: List owned conversations, newest first
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Owned conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/chats/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: deleteChat
      summary: Delete an owned conversation and all its messages
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Conversation and messages deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ChatNotFound' }
        '409': { $ref: '#/components/responses/ChatBusy' }
  /api/v1/chats/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: listChatMessages
      summary: List messages of an owned conversation in creation order
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Conversation messages, including failed replies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatMessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ChatNotFound' }
    post:
      operationId: sendChatMessage
      summary: Save a user message and an AI reply
      description: >-
        Only one reply may run per conversation. The user message is retained if the
        worker fails; the assistant message is marked FAILED. Worker calls run outside
        database transactions. Only COMPLETED messages are sent as worker context.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '201':
          description: User message and completed assistant reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatTurnResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ChatNotFound' }
        '409': { $ref: '#/components/responses/ChatBusy' }
        '502': { $ref: '#/components/responses/WorkerFailure' }
  /api/v1/chats/{id}/messages/stream:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: streamChatMessage
      summary: Save a user message and stream the AI reply
      description: >-
        Emits token events containing text chunks, then a done event containing the
        assistant message ID. A worker failure emits an error event with a generic
        message and persists partial content with FAILED status. Client cancellation
        marks the reply FAILED. Errors before streaming use ordinary HTTP responses.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: token, done, or error SSE events
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ChatNotFound' }
        '409': { $ref: '#/components/responses/ChatBusy' }
  /v1/chat:
    servers: [{ url: 'http://ai-worker:8000' }]
    post:
      operationId: workerChat
      summary: API-side contract for the future worker chat endpoint
      security: [{ workerApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerChatRequest' }
      responses:
        '200':
          description: Nonblank AI response
          content:
            application/json:
              schema:
                type: object
                required: [content]
                properties:
                  content: { type: string, minLength: 1, pattern: '\S' }
  /v1/chat/stream:
    servers: [{ url: 'http://ai-worker:8000' }]
    post:
      operationId: workerChatStream
      summary: API-side contract for the future worker streaming endpoint
      description: Each SSE data field is a plain text chunk; end of stream indicates completion.
      security: [{ workerApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerChatRequest' }
      responses:
        '200':
          description: AI text chunks
          content:
            text/event-stream:
              schema: { type: string }
components:
  securitySchemes:
    workerApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        API access JWT. Signature, issuer, expiration, and persisted session status are
        validated on each authenticated request. Authentication endpoints use their JSON
        credentials instead; an Authorization header on those endpoints is ignored.
  schemas:
    ChatRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 10000, pattern: '\S' }
    ChatResponse:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    ChatMessageResponse:
      type: object
      required: [id, role, content, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        role: { type: string, enum: [SYSTEM, USER, ASSISTANT] }
        content: { type: string }
        status: { type: string, enum: [PENDING, STREAMING, COMPLETED, FAILED] }
        createdAt: { type: string, format: date-time }
    ChatTurnResponse:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage: { $ref: '#/components/schemas/ChatMessageResponse' }
        assistantMessage: { $ref: '#/components/schemas/ChatMessageResponse' }
    WorkerChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant] }
              content: { type: string }
    DiaryRequest:
      type: object
      required: [todoIds, diaryFiles]
      properties:
        content: { type: [string, 'null'], maxLength: 1000 }
        todoIds:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
        diaryFiles:
          type: array
          items: { $ref: '#/components/schemas/DiaryFileRequest' }
    DiaryFileRequest:
      type: object
      required: [imageUrl]
      properties:
        imageUrl: { type: string, minLength: 1, maxLength: 2048, pattern: '\S' }
    DiaryResponse:
      type: object
      required: [id, todos, diaryFiles]
      properties:
        id: { type: integer, format: int64 }
        content: { type: [string, 'null'], maxLength: 1000 }
        todos:
          type: array
          items: { $ref: '#/components/schemas/TodoResponse' }
        diaryFiles:
          type: array
          items:
            type: object
            required: [id, imageUrl]
            properties:
              id: { type: integer, format: int64 }
              imageUrl: { type: string, maxLength: 2048 }
    TodoRequest:
      type: object
      required: [planName, scheduledDate, scheduledTime]
      properties:
        planName: { type: string, minLength: 1, maxLength: 80, pattern: '\S' }
        content: { type: [string, 'null'] }
        scheduledDate: { type: string, format: date }
        scheduledTime: { type: string, example: '09:00:00', description: Local time without a time zone }
    TodoResponse:
      type: object
      required: [id, planName, scheduledDate, scheduledTime]
      properties:
        id: { type: integer, format: int64 }
        planName: { type: string }
        content: { type: [string, 'null'] }
        scheduledDate: { type: string, format: date }
        scheduledTime: { type: string, example: '09:00:00', description: Local time without a time zone }
    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, pattern: '\S' }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          description: Also limited to 72 UTF-8 bytes; whitespace is not trimmed.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          description: Also limited to 72 UTF-8 bytes; whitespace is not trimmed.
    TokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 200, pattern: '\S', writeOnly: true }
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string, description: Signed access JWT }
        refreshToken: { type: string, description: Opaque random token; only its SHA-256 digest is stored }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64, minimum: 1, description: Access-token lifetime in seconds }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, EMAIL_ALREADY_EXISTS, INVALID_CREDENTIALS, INVALID_REFRESH_TOKEN, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, BAD_GATEWAY, INTERNAL_ERROR]
        message: { type: string }
  responses:
    ChatNotFound:
      description: Conversation does not exist or belongs to another user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ChatBusy:
      description: An assistant reply is already in progress in this conversation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WorkerFailure:
      description: Worker unavailable, timed out, or returned an invalid reply
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Diary:
      description: Diary details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DiaryResponse' }
    DiaryOrTodoNotFound:
      description: Diary or todo does not exist, belongs to another user, or has no known owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TodoAlreadyLinked:
      description: Todo is already linked to another diary of the authenticated user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Todo:
      description: Todo details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TodoResponse' }
    TodoNotFound:
      description: Todo does not exist, belongs to another user, or has no known owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Tokens:
      description: Tokens issued; response must not be cached
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Pragma: { schema: { type: string, const: no-cache } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LoginResponse' }
    InvalidRequest:
      description: Invalid request fields or malformed JSON
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Invalid credentials, expired/revoked token, or refresh-token reuse
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
